name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an older in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: onnxruntime-node's postinstall fetches optional GPU binaries we don't need.
      - name: Install
        run: npm ci --ignore-scripts

      # The embedding model (~34 MB) is downloaded from Hugging Face once, then reused from cache.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: public/models
          key: model-Xenova-bge-small-en-v1.5-q8-v1

      # prepare-search (chunk + embed) → retrieval eval → astro build
      - name: Build
        run: npm run build

      - name: Search eval summary
        run: cat src/data/generated/search-eval.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
